[supervisord]
nodaemon=true
user=root
; supervisord 自身日志直接进容器标准输出，不在 tmpfs 中落盘
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=warn
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:easy-strm]
command=/app/easy-strm
directory=/app
autostart=true
autorestart=true
; 应用已按天写入 /app/logs/info_*.log 与 debug_*.log（系统日志页面读取这些文件，并按保留天数清理）。
; 标准输出只交给 Docker（docker logs），不再额外落成 access.log / error.log，避免同一条日志在磁盘上存两份。
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
