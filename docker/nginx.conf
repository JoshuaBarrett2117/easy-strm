server {
    listen 80;
    server_name localhost;

    # 前端静态文件
    root /app/frontend/dist;
    index index.html;

    # 前端路由 - 所有非API请求返回index.html (SPA支持)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存，保证发版后立即拿到新的资源清单
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite 产物带内容哈希，可长期强缓存
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 健康检查（无需鉴权）：/healthz 直通后端；/api/healthz 经下方 /api/ 前缀剥离后同样到达后端 /healthz
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8082/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # API代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 直链API代理 (用于STRM文件访问)
    location /open/ {
        proxy_pass http://127.0.0.1:8082/open/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 直链获取接口 (用于STRM播放时的302重定向)
    location /direct-link {
        proxy_pass http://127.0.0.1:8082/direct-link;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 分享资料库按需转存播放入口，保留播放器 User-Agent 和302响应。
    location /share-strm/ {
        proxy_pass http://127.0.0.1:8082/share-strm/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 日志配置：请求明细由后端 http 模块按结果分级记录，nginx 访问日志重复且无人查看，关闭；
    # 错误日志只保留 warn 以上并输出到标准错误（docker logs）。
    access_log off;
    error_log /dev/stderr warn;

    # gzip压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1000;
}
