services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: easy-strm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      # 密码只从 .env 读取，未设置时 compose 直接报错
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 中设置 PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE:-easy_strm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 默认仅本机可连；确需局域网访问再改为 0.0.0.0
      - "${PG_BIND:-127.0.0.1}:${PG_PORT_EXPOSE:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: easy-strm-redis
    restart: unless-stopped
    # 密码经环境变量传入，不写进容器命令行
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT_EXPOSE:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Easy-STRM 主应用
  easy-strm:
    build:
      context: .
      dockerfile: Dockerfile
    # 默认使用已发布镜像：docker compose pull && docker compose up -d；从源码构建：docker compose up -d --build
    image: ${DOCKER_USERNAME:-joshuabarrett2117}/easy-strm:latest
    container_name: easy-strm-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      # Emby 实例配置反代端口后，逐个取消注释或增加对应映射；不会自动发布。
      # - "8097:8097"
    environment:
      # 服务器配置
      SERVER_URL: ${SERVER_URL:-http://localhost:80}
      JWT_SECRET: ${JWT_SECRET:-easy_strm_jwt_secret}
      
      # 115 API 配置 (可选)
      APP_ID: ${APP_ID:-}
      APP_SECRET: ${APP_SECRET:-}
      REDIRECT_URI: ${REDIRECT_URI:-}
      BASE_URL: ${BASE_URL:-https://proapi.115.com}
      
      # PostgreSQL 配置
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-easy_strm}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:?请在 .env 中设置 PG_PASSWORD}
      
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    # 与 Dockerfile 一致：后端 /healthz 检查 PostgreSQL 与 Redis，任一不可用即 unhealthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    # 限制 docker logs 体积（标准输出只含 INFO 及以上）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  app_logs:
