services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: easy-strm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-easy_strm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT_EXPOSE:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: easy-strm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT_EXPOSE:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Easy-STRM 主应用
  easy-strm:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-}/easy-strm:latest
    container_name: easy-strm-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      # 服务器配置
      SERVER_URL: ${SERVER_URL:-http://localhost:80}
      JWT_SECRET: ${JWT_SECRET:-easy_strm_jwt_secret}
      
      # 115 API 配置 (可选)
      APP_ID: ${APP_ID:-}
      APP_SECRET: ${APP_SECRET:-}
      REDIRECT_URI: ${REDIRECT_URI:-}
      BASE_URL: ${BASE_URL:-https://proapi.115.com}
      
      # PostgreSQL 配置
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-easy_strm}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs

volumes:
  postgres_data:
  redis_data:
  app_logs:
